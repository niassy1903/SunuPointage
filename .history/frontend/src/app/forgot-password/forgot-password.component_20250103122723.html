<div class="container-fluid vh-100 d-flex flex-column">
    <!-- Contenu principal -->
    <div class="row flex-grow-1 justify-content-center align-items-center">
      <div class="col-12 col-sm-8 col-md-6 col-lg-3 shadow p-4 rounded ">
        <!-- Logo -->
        <div class="text-center">
          <img src="assets/images/sunu_logo7.png" alt="SunuPointage" class="img-fluid" style="max-width: 200px;">
        </div>
        <!-- Titre et description -->
        <h3 class="text-center mb-2">Connectez-vous à votre compte.</h3>
        <p class="text-center text-muted mb-4">
          Scannez votre carte pour accéder facilement au système et à la plateforme !
        </p>
        <!-- Formulaire -->
        <form>
            <!-- Email -->
            <div class="mb-3">
                <label for="email" class="form-label">Adresse e-mail</label>
                <div class="input-group">
                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                <input
                    type="email"
                    class="form-control"
                    id="email"
                    placeholder="Entrer votre adresse email">
                </div>
            </div>
  
            <!-- Mot de passe -->
            <div class="mb-3">
                <label for="password" class="form-label">Mot de passe</label>
                <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                <input
                    type="password"
                    class="form-control"
                    id="password"
                    placeholder="Entrer votre mot de passe">
                <button type="button" class="btn btn-outline-secondary">
                    <i class="bi bi-eye"></i>
                </button>
                </div>
            </div>
            
            <!-- Bouton de soumission -->
            <button type="submit" class="btn btn-success w-100">Se connecter</button>
        </form>
      </div>
    </div>
    <!-- Footer -->
    <footer class="row bg-white border-top py-3 text-center mt-auto">
      <div class="col">
        <small class="text-muted">Copyright 2024 SunuPointage ©</small>
        <div>
          <a href="#" class="text-decoration-none text-success mx-2">Privacy Policy</a>
          <a href="#" class="text-decoration-none text-success mx-2">Terms & Conditions</a>
        </div>
      </div>
    </footer>
  </div>

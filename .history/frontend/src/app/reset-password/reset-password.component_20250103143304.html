<div class="container-fluid w-100 vh-100 d-flex flex-column">
    <!-- Contenu principal -->
    <div class="row flex-grow-1 justify-content-center align-items-center">
      <div class="col-12 col-sm-8 col-md-6 col-lg-4 shadow p-4 rounded">
        <!-- Logo -->
        <div class="text-center mb-3">
          <img src="assets/images/sunu_logo7.png" alt="SunuPointage" class="img-fluid" style="max-width: 200px;">
        </div>
        
        <!-- Titre et description -->
        <h3 class="text-center mb-3">Réinitialiser votre mot de passe</h3>
        <p class="text-center text-muted mb-4">
          Utilisez une combinaison de chiffres, de majuscules, de minuscules et de caractères spéciaux.
        </p>
  
        <!-- Formulaire -->
        <form (ngSubmit)="resetPassword()">
          <!-- Nouveau mot de passe -->
          <div class="form-group mb-3">
            <label for="password" class="form-label">Nouveau mot de passe</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-lock"></i></span>
              <input
                type="password"
                class="form-control"
                id="password"
                [(ngModel)]="newPassword"
                name="password"
                placeholder="Entrer votre nouveau mot de passe"
                required
              />
              <span class="input-group-text"><i class="bi bi-eye" (click)="togglePasswordVisibility()"></i></span>
            </div>
            <small *ngIf="passwordError" class="text-danger">{{ passwordError }}</small>
          </div>
  
          <!-- Confirmation du mot de passe -->
          <div class="form-group mb-3">
            <label for="confirmPassword" class="form-label">Confirmer le mot de passe</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-lock"></i></span>
              <input
                type="password"
                class="form-control"
                id="confirmPassword"
                [(ngModel)]="confirmPassword"
                name="confirmPassword"
                placeholder="Confirmer le mot de passe"
                required
              />
              <span class="input-group-text"><i class="bi bi-eye" (click)="toggleConfirmPasswordVisibility()"></i></span>
            </div>
            <small *ngIf="confirmPasswordError" class="text-danger">{{ confirmPasswordError }}</small>
          </div>
  
          <!-- Bouton de soumission -->
          <button type="submit" class="btn btn-success w-100" [disabled]="!newPassword || !confirmPassword">
            Réinitialiser le mot de passe <i class="bi bi-arrow-right-circle"></i>
          </button>
        </form>
  
        <!-- Messages de retour -->
        <div *ngIf="message" class="alert alert-success mt-3">
          {{ message }}
        </div>
        <div *ngIf="error" class="alert alert-danger mt-3">
          {{ error }}
        </div>
      </div>
    </div>
  
    <!-- Footer -->
    <footer class="row bg-white border-top py-3 text-center mt-auto">
      <div class="col">
        <small class="text-muted">Copyright 2024 SunuPointage ©</small>
        <div>
          <a href="#" class="text-decoration-none text-success mx-2">Privacy Policy</a>
          <a href="#" class="text-decoration-none text-success mx-2">Terms & Conditions</a>
        </div>
      </div>
    </footer>
  </div>
